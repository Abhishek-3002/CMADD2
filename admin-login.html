<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Choudhary Medical</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .login-box {
            max-width: 420px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .login-box h1 {
            margin-bottom: 10px;
        }

        .login-box p {
            color: #666;
        }

        .form-group {
            margin-top: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .login-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0b7a3b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #ffeaea;
            color: #a00000;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <div class="container">
        <h2>Choudhary Medical and Drug Distributors</h2>
    </div>
</header>

<main class="container">

    <div class="login-box">

        <h1>🔐 Admin Login</h1>

        <p>Login to access the complaint management panel.</p>

        <form id="loginForm">

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>

        <div class="error" id="errorBox"></div>

    </div>

</main>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const errorBox =
        document.getElementById("errorBox");

    errorBox.style.display = "none";

    try {

        const response = await fetch("/api/admin/login", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Login failed."
            );
        }

        localStorage.setItem(
            "adminToken",
            data.token
        );

        window.location.href = "admin.html";

    } catch (error) {

        errorBox.textContent =
            "❌ " + error.message;

        errorBox.style.display = "block";
    }

});
</script>

</body>
</html>
