name: CMADD2 syntax and integration checks
on:
  push:
    branches: [main, feature/customer-email-auth, audit/production-safety]
  pull_request:
    branches: [main, feature/customer-email-auth]
jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check auth.js
          node --check ledger.js
          node --check meetings.js
          node --check offers.js
          node --check analytics.js
          node --check business.js
          node --check script.js
          node --check tests/integration.test.js
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Run isolated integration tests
        run: node --test tests/integration.test.js
