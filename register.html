<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Registration | Choudhary Medical</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#edf9f5,#f7faf9);color:#172b2b;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:100%;max-width:500px;background:#fff;padding:30px;border-radius:20px;box-shadow:0 15px 45px #102f3018}.brand{color:#116466;font-weight:800;font-size:20px;text-align:center}.sub{text-align:center;color:#667777;margin:8px 0 22px}h1{font-size:27px;margin:0 0 8px;text-align:center;color:#116466}label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #ccd8d5;border-radius:10px;font-size:16px}button{width:100%;padding:14px;margin-top:20px;background:#116466;color:#fff;border:0;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.message{margin-top:15px;padding:12px;border-radius:9px;display:none}.message.error{display:block;background:#fff0f0;color:#a52020}.message.success{display:block;background:#effaf2;color:#176a2b}.foot{text-align:center;margin-top:20px;color:#566666}.foot a,.back a{color:#116466;font-weight:700}.back{text-align:center;margin-top:18px}.notice{background:#fff8e6;color:#6b4e00;padding:12px;border-radius:10px;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<main class="card">
<div class="brand">Choudhary Medical<br><small>and Drug Distributors</small></div>
<p class="sub">Customer Account</p>
<h1>Register your medical store</h1>
<p class="sub">Fill in your details to request account access.</p>
<div class="notice">Your account will remain pending until the admin approves it. You can log in after approval.</div>
<form id="registerForm">
<label for="medicalName">Medical store name</label><input id="medicalName" name="medicalName" required maxlength="160" autocomplete="organization" placeholder="Your medical store name">
<label for="customerName">Your full name</label><input id="customerName" name="customerName" required maxlength="120" autocomplete="name" placeholder="Customer / owner name">
<label for="mobile">Mobile number</label><input id="mobile" name="mobile" type="tel" inputmode="tel" autocomplete="tel" required maxlength="18" pattern="[+0-9 -]{10,18}" placeholder="10-digit mobile number">
<label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
<label for="password">Create password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="At least 8 characters">
<label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="Re-enter password">
<button id="submitBtn" type="submit">Submit for Approval</button>
<div id="message" class="message" role="status" aria-live="polite"></div>
</form>
<div class="foot">Already registered? <a href="login.html">Log in</a></div>
<div class="back"><a href="index.html">← Back to website</a></div>
</main>
<script>
const form=document.getElementById("registerForm"),msg=document.getElementById("message"),btn=document.getElementById("submitBtn");
form.addEventListener("submit",async(e)=>{e.preventDefault();msg.className="message";msg.textContent="";
if(form.password.value!==form.confirmPassword.value){msg.textContent="Passwords do not match.";msg.className="message error";return;}
btn.disabled=true;btn.textContent="Submitting…";
try{const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({medicalName:form.medicalName.value,customerName:form.customerName.value,mobile:form.mobile.value,email:form.email.value,password:form.password.value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Registration failed.");msg.textContent=d.message||"Request submitted for approval.";msg.className="message success";form.reset();btn.textContent="Request Submitted";}
catch(err){msg.textContent=err.message||"Something went wrong.";msg.className="message error";btn.disabled=false;btn.textContent="Submit for Approval";}
});
</script>
</body>
</html>
