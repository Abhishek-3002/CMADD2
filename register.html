<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Choudhary Medical</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#edf9f5,#f7faf9);color:#172b2b;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:100%;max-width:430px;background:#fff;padding:32px;border-radius:20px;box-shadow:0 15px 45px #102f3018}.brand{color:#116466;font-weight:800;font-size:20px;text-align:center}.sub{text-align:center;color:#667777;margin:8px 0 26px}h1{font-size:27px;margin:0 0 8px;text-align:center;color:#116466}label{display:block;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #ccd8d5;border-radius:10px;font-size:16px}button{width:100%;padding:14px;margin-top:20px;background:#116466;color:#fff;border:0;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.message{margin-top:15px;padding:12px;border-radius:9px;display:none}.message.error{display:block;background:#fff0f0;color:#a52020}.message.success{display:block;background:#effaf2;color:#176a2b}.foot{text-align:center;margin-top:20px;color:#566666}.foot a,.back a{color:#116466;font-weight:700}.back{text-align:center;margin-top:18px}
</style>
</head>
<body>
<main class="card">
<div class="brand">Choudhary Medical<br><small>and Drug Distributors</small></div>
<p class="sub">Customer Account</p>
<h1>Create account</h1>
<p class="sub">Use your email and create a strong password.</p>
<form id="registerForm">
<label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
<label for="password">Create password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="At least 8 characters">
<label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="Re-enter password">
<button id="submitBtn" type="submit">Create Account</button>
<div id="message" class="message" role="status" aria-live="polite"></div>
</form>
<div class="foot">Already registered? <a href="login.html">Log in</a></div>
<div class="back"><a href="index.html">← Back to website</a></div>
</main>
<script>
const form=document.getElementById("registerForm"),msg=document.getElementById("message"),btn=document.getElementById("submitBtn");
form.addEventListener("submit",async(e)=>{e.preventDefault();msg.className="message";msg.textContent="";
if(form.password.value!==form.confirmPassword.value){msg.textContent="Passwords do not match.";msg.className="message error";return;}
btn.disabled=true;btn.textContent="Creating account…";
try{const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:form.email.value,password:form.password.value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Registration failed.");msg.textContent="Account created. Redirecting…";msg.className="message success";window.location.href="index.html";}
catch(err){msg.textContent=err.message||"Something went wrong.";msg.className="message error";}
finally{btn.disabled=false;btn.textContent="Create Account";}});
</script>
</body>
</html>
