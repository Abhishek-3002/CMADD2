<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Requests | CMADD Admin</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#f4f8f7;color:#183333;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto}.panel{background:white;padding:18px;border-radius:14px;margin-top:18px;box-shadow:0 8px 28px #173c3c0b}.filters,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,input,textarea,button{font:inherit;padding:10px;border:1px solid #ccd8d5;border-radius:8px}button{cursor:pointer}.primary{background:#116466;color:white;border-color:#116466}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:980px}th,td{text-align:left;vertical-align:top;padding:11px;border-bottom:1px solid #e5eeeb}th{background:#f7fbf9}.muted{color:#607572}.status{padding:5px 8px;border-radius:20px;background:#fff3d5;font-size:12px}.status.Confirmed,.status.Completed{background:#e5f7eb;color:#176b38}.status.Cancelled{background:#ffe8e8;color:#9d2929}.message{margin-top:12px}.error{color:#a32626}.edit{display:grid;gap:7px;min-width:210px}.edit textarea{min-height:58px}@media(max-width:600px){body{padding:12px}.panel{padding:12px}}</style></head><body><main class="wrap"><a href="admin.html">← Admin dashboard</a><h1>Meeting requests</h1><p class="muted">Review requests and set the status. Add an HTTPS meeting link for online meetings; no automatic WhatsApp API messages are sent.</p><section class="panel"><div class="filters"><label for="filter">Status</label><select id="filter"><option>Pending</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option><option>All</option></select><button id="refresh" class="primary">Refresh</button></div><div id="message" class="message" aria-live="polite"></div><div class="tablewrap"><table><thead><tr><th>Meeting ID</th><th>Customer / Medical</th><th>Contact & address</th><th>Preferred time</th><th>Type / request notes</th><th>Update request</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section></main><script>
const rows=document.getElementById("rows"),message=document.getElementById("message"),filter=document.getElementById("filter");
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
async function api(url,opts={}){const r=await fetch(url,{credentials:"same-origin",...opts});const d=await r.json();if(r.status===401){location.href="admin-login.html";throw new Error("Admin login required")}if(!r.ok||!d.success)throw new Error(d.message||"Request failed");return d}
async function load(){message.textContent="Loading…";try{const d=await api("/api/admin/meetings?status="+encodeURIComponent(filter.value));rows.innerHTML=d.meetings.length?d.meetings.map(m=>'<tr><td><strong>'+esc(m.meeting_id)+'</strong><br><span class="status '+esc(m.status)+'">'+esc(m.status)+'</span></td><td>'+esc(m.customer_name)+'<br><b>'+esc(m.medical_name)+'</b></td><td>'+esc(m.mobile)+'<br>'+esc(m.address)+'</td><td>'+esc(m.requested_date)+'<br>'+esc(m.requested_time)+'</td><td>'+esc(m.meeting_type)+'<br>'+esc(m.notes||"No notes")+'<br><small>Submitted '+esc(m.created_at)+'</small></td><td><form class="edit" data-id="'+esc(m.meeting_id)+'"><label>Status<select name="status">'+["Pending","Confirmed","Completed","Cancelled"].map(s=>'<option '+(s===m.status?'selected':'')+'>'+s+'</option>').join("")+'</select></label><label>Online meeting link<input name="meetingLink" type="url" placeholder="https://…" value="'+esc(m.meeting_link||"")+'"></label><label>Admin notes<textarea name="adminNotes" maxlength="1000">'+esc(m.admin_notes||"")+'</textarea></label><button class="primary" type="submit">Save update</button></form></td></tr>').join(""):'<tr><td colspan="6">No meeting requests for this filter.</td></tr>';message.textContent="Loaded "+d.meetings.length+" request(s)."}catch(e){message.textContent=e.message;rows.innerHTML='<tr><td colspan="6" class="error">'+esc(e.message)+'</td></tr>'}}
rows.addEventListener("submit",async e=>{if(!e.target.matches("form[data-id]"))return;e.preventDefault();const f=e.target,b=f.querySelector("button");b.disabled=true;try{const d=await api("/api/admin/meetings/"+encodeURIComponent(f.dataset.id),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:f.elements.status.value,meetingLink:f.elements.meetingLink.value.trim(),adminNotes:f.elements.adminNotes.value.trim()})});message.textContent=d.message;await load()}catch(err){message.textContent=err.message;b.disabled=false}});
document.getElementById("refresh").addEventListener("click",load);filter.addEventListener("change",load);load();
</script></body></html>
