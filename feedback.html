<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Customer Feedback | CMADD</title><link rel="stylesheet" href="motion-theme.css?v=2">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#20242b;background:linear-gradient(135deg,#fff,#fff5f5);min-height:100vh}.top{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:#ffffffeb;backdrop-filter:blur(12px);border-bottom:1px solid #eee}.brand{font-weight:800;color:#c62828;line-height:1.35}.top a,.btn{color:#fff;background:#c62828;padding:11px 16px;border-radius:10px;text-decoration:none;font-weight:700;border:0;cursor:pointer}.wrap{width:min(760px,92%);margin:42px auto}.card{background:white;border:1px solid #eee;border-radius:22px;padding:clamp(22px,5vw,42px);box-shadow:0 18px 48px #20242b10;animation:up .55s ease both}.tag{font-size:12px;letter-spacing:2px;font-weight:800;color:#c62828}.card h1{font-size:clamp(28px,5vw,40px);margin:12px 0}.card p{line-height:1.65;color:#667085}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:24px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{font:inherit;padding:13px;border:1px solid #e0e2e7;border-radius:11px;background:#fcfcfd;width:100%;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#c62828;box-shadow:0 0 0 4px #c6282814}.btn{width:100%;padding:15px;margin-top:20px;font-size:16px;background:linear-gradient(120deg,#c62828,#a71919);box-shadow:0 8px 20px #c6282825}.note{text-align:center;font-size:12px!important;margin-top:12px}@keyframes up{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@media(max-width:580px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{padding:14px 4%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="top"><div class="brand">Choudhary Medical<br>and Drug Distributors</div><a href="index.html">← Home</a></header>
<main class="wrap"><section class="card"><span class="tag">SIMPLE • NO LOGIN</span><h1>Share Your Feedback</h1><p>Aapka feedback hamare liye important hai. Details bharkar WhatsApp par share karein.</p>
<form id="requestForm"><div class="grid"><div class="field"><label for="customerName">Your Name *</label><input id="customerName" name="customerName" type="text" required  placeholder="Enter your name"></div>
<div class="field"><label for="medicalName">Medical / Shop Name *</label><input id="medicalName" name="medicalName" type="text" required  placeholder="Enter medical / shop name"></div>
<div class="field"><label for="mobile">Mobile Number *</label><input id="mobile" name="mobile" type="tel" required inputmode="tel" placeholder="Enter mobile number"></div>
<div class="field"><label for="rating">Rating (1 to 5) *</label><select id="rating" name="rating" required><option value="">Choose rating</option><option value="5/5">5 - Excellent</option><option value="4/5">4 - Very Good</option><option value="3/5">3 - Good</option><option value="2/5">2 - Needs Improvement</option><option value="1/5">1 - Poor</option></select></div>
<div class="field full"><label for="message">Your Feedback *</label><textarea id="message" name="message" required rows="4" placeholder="Write here..."></textarea></div></div><button class="btn" type="submit">💬 Share Feedback on WhatsApp</button><p class="note">Message WhatsApp par khulega. Send button aapko khud dabana hoga.</p></form>
</section></main>
<script>
document.getElementById('requestForm').addEventListener('submit',async function(e){e.preventDefault();if(!this.reportValidity())return;const d=new FormData(this);const customerName=String(d.get('customerName')).trim(),medicalName=String(d.get('medicalName')).trim(),mobile=String(d.get('mobile')).trim(),rating=String(d.get('rating')).split('/')[0],message=String(d.get('message')).trim();try{await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_name:customerName,mobile,rating,message})})}catch(err){console.warn('Feedback database save unavailable',err)}const lines=['*CMADD - Feedback*','', '*Your Name:* '+customerName,'*Medical / Shop Name:* '+medicalName,'*Mobile:* '+mobile,'*Rating:* '+rating+'/5','*Your Feedback:* '+message,'','Sent from CMADD website.'];window.open('https://wa.me/918000540156?text='+encodeURIComponent(lines.join('\n')),'_blank','noopener');});
</script><script src="script.js"></script>

<script src="/ai-assistant.js?v=3" defer></script>
</body></html>
