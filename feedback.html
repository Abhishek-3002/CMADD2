<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feedback - Choudhary Medical</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

.header {
    background: linear-gradient(135deg, #075e35, #0b8f50);
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 550px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

h1 {
    margin-top: 0;
}

.subtitle {
    color: #666;
    line-height: 1.5;
}

.form-group {
    margin-top: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d5dbe3;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #0b8f50;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

.rating {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.star {
    font-size: 34px;
    cursor: pointer;
    color: #ccc;
    transition: .2s;
}

.star.active {
    color: #f5b301;
}

.submit-btn {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #075e35;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:hover {
    opacity: .9;
}

.message {
    display: none;
    margin-top: 20px;
    padding: 14px;
    border-radius: 9px;
    text-align: center;
}

.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #075e35;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<header class="header">

    <h2>Choudhary Medical and Drug Distributors</h2>

    <p>We value your feedback</p>

</header>

<main class="container">

    <div class="card">

        <h1>⭐ Share Your Feedback</h1>

        <p class="subtitle">
            Tell us about your experience. Your feedback helps us
            improve our service.
        </p>

        <form id="feedbackForm">

            <div class="form-group">

                <label>Customer Name</label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your name"
                    required
                >

            </div>

            <div class="form-group">

                <label>Mobile Number</label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter mobile number"
                    required
                >

            </div>

            <div class="form-group">

                <label>Your Rating</label>

                <div class="rating">

                    <span class="star" data-rating="1">★</span>
                    <span class="star" data-rating="2">★</span>
                    <span class="star" data-rating="3">★</span>
                    <span class="star" data-rating="4">★</span>
                    <span class="star" data-rating="5">★</span>

                </div>

            </div>

            <div class="form-group">

                <label>Your Feedback</label>

                <textarea
                    id="message"
                    placeholder="Write your feedback..."
                    required
                ></textarea>

            </div>

            <button
                type="submit"
                class="submit-btn"
            >
                Submit Feedback
            </button>

        </form>

        <div id="resultMessage" class="message"></div>

        <a href="index.html" class="back">
            ← Back to Website
        </a>

    </div>

</main>

<script>

let selectedRating = 0;

const stars =
    document.querySelectorAll(".star");

stars.forEach(star => {

    star.addEventListener("click", () => {

        selectedRating =
            Number(star.dataset.rating);

        stars.forEach(s => {

            const rating =
                Number(s.dataset.rating);

            s.classList.toggle(
                "active",
                rating <= selectedRating
            );

        });

    });

});

document
    .getElementById("feedbackForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const customerName =
            document
                .getElementById("customerName")
                .value
                .trim();

        const mobile =
            document
                .getElementById("mobile")
                .value
                .trim();

        const message =
            document
                .getElementById("message")
                .value
                .trim();

        const result =
            document.getElementById("resultMessage");

        result.className = "message";
        result.textContent = "";

        if (selectedRating === 0) {

            result.textContent =
                "⭐ Please select a rating.";

            result.classList.add("error");

            return;
        }

        try {

            const response =
                await fetch("/api/feedback", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        customerName: customerName,
                        mobile: mobile,
                        rating: selectedRating,
                        message: message
                    })

                });

            const data =
                await response.json();

            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Unable to submit feedback."
                );
            }

            result.textContent =
                "✅ Thank you! Your feedback has been submitted successfully.";

            result.classList.add("success");

            document
                .getElementById("feedbackForm")
                .reset();

            selectedRating = 0;

            stars.forEach(s =>
                s.classList.remove("active")
            );

        } catch (error) {

            result.textContent =
                "❌ " + error.message;

            result.classList.add("error");
        }

    });

</script>

</body>
</html>
