(()=>{const v=document.querySelector('#head'),h=document.querySelector('#helmet'),b=document.querySelector('#push'),ring=document.querySelector('#ring'),dot=document.querySelector('#dot');let target=.5,shown=.5,last=performance.now(),px=innerWidth/2,py=innerHeight/2,rx=px,ry=py,ready=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;async function load(){if(reduced)return;try{const r=await fetch(v.querySelector('source').src);if(!r.ok)throw 0;v.src=URL.createObjectURL(await r.blob());v.load()}catch(e){v.load()}v.addEventListener('loadedmetadata',()=>{ready=true;v.currentTime=target*Math.max(0,v.duration-.01);v.classList.add('ready')},{once:true})}load();addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;target=Math.max(0,Math.min(1,(px/innerWidth-.14)/.72));last=performance.now()});function loop(t){if(ready&&v.duration){if(t-last>3500)target=.5+Math.sin(t/1700)*.32;shown+=(target-shown)*.14;if(!v.seeking){const x=shown*Math.max(0,v.duration-.01);if(Math.abs(v.currentTime-x)>.025)try{v.currentTime=x}catch(e){}}}rx+=(px-rx)*.55;ry+=(py-ry)*.55;ring.style.transform='translate('+rx+'px,'+ry+'px)';dot.style.transform='translate('+px+'px,'+py+'px)';requestAnimationFrame(loop)}requestAnimationFrame(loop);b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));h.classList.toggle('on',on);b.animate([{scale:'1'},{scale:'.88'},{scale:'1'}],{duration:320})})})();
</script></body></html>
