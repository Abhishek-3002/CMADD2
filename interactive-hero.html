<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#071126;color:#fff;font-family:Inter,"Segoe UI",Arial,sans-serif}
body{overflow:hidden}
.hero{position:relative;isolation:isolate;display:flex;align-items:center;min-height:100svh;height:100vh;padding:clamp(24px,6vw,76px);overflow:hidden;background:radial-gradient(ellipse at 78% 48%,#123c67 0,transparent 44%),linear-gradient(135deg,#050b19,#0a1a31 58%,#081020)}
.glass-orb{position:absolute;z-index:-1;width:min(64vw,560px);aspect-ratio:1;right:4%;top:50%;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#6dcaff42,#1474c52a 32%,#0b3d7040 52%,transparent 70%);border:1px solid #a4dcff17;box-shadow:inset 0 0 65px #68c6ff0a,0 0 100px #0c7be71b;animation:orbFloat 8s ease-in-out infinite}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(#ffffff55 .7px,transparent .7px);background-size:36px 36px;opacity:.12;mask-image:linear-gradient(90deg,transparent,#000)}
.hero-inner{width:min(760px,100%);position:relative;transition:transform .2s ease-out}
.eyebrow{display:inline-flex;align-items:center;gap:9px;color:#d8eaff;border:1px solid #8acfff45;background:#ffffff0b;padding:9px 13px;border-radius:999px;backdrop-filter:blur(14px);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;box-shadow:inset 0 1px #ffffff12;animation:fadeUp .8s both}
.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:#61e6b3;box-shadow:0 0 13px #61e6b3}
h1{position:relative;max-width:850px;margin:25px 0 0;font-size:clamp(32px,5.5vw,72px);line-height:1.04;letter-spacing:-.045em;font-weight:850;text-wrap:balance;text-shadow:0 8px 40px #0005}
.brand-line{display:block;color:#fff}
.brand-line:last-child{background:linear-gradient(100deg,#fff 4%,#a7dcff 58%,#7dbbff 92%);background-clip:text;-webkit-background-clip:text;color:transparent}
.subtext{max-width:460px;margin:22px 0 0;color:#d2deed;font-size:clamp(14px,1.5vw,17px);line-height:1.75;animation:fadeUp .8s .2s both}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:27px}
.glass-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:12px 17px;border:1px solid #b7e2ff55;border-radius:14px;color:#fff;text-decoration:none;font-size:13px;font-weight:800;background:linear-gradient(135deg,#ffffff20,#ffffff08);box-shadow:inset 0 1px #ffffff30,0 10px 28px #0002;backdrop-filter:blur(18px);transition:transform .25s,border-color .25s,box-shadow .25s}
.glass-btn:hover{transform:translateY(-3px);border-color:#8bd5ff;box-shadow:inset 0 1px #ffffff50,0 14px 32px #1e8cff2b}
.glass-btn.primary{background:linear-gradient(120deg,#137fe6d9,#2450c8c9)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes orbFloat{0%,100%{translate:0 -50%;scale:1}50%{translate:-12px calc(-50% - 14px);scale:1.035}}
@media(max-width:700px){.hero{align-items:center;padding:34px 21px;min-height:100svh}.hero-inner{margin-top:15px}.glass-orb{width:115vw;right:-44%;top:57%;opacity:.8}.eyebrow{font-size:9px;letter-spacing:.13em}h1{font-size:clamp(32px,9.2vw,48px);margin-top:20px}.subtext{font-size:14px;margin-top:17px}.hero-actions{display:grid;grid-template-columns:1fr;width:100%;gap:10px;margin-top:22px}.glass-btn{width:100%;min-height:45px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="hero" id="hero">
<div class="glass-orb" id="glassOrb" aria-hidden="true"></div>

<h1 aria-label="Choudhary Medical and Drug Distributors"><span class="brand-line">CHOUDHARY MEDICAL</span><span class="brand-line">AND DRUG DISTRIBUTORS</span></h1>

<div class="hero-actions">
<a class="glass-btn primary" href="products.html" target="_top">Explore Products <span aria-hidden="true">↗</span></a>
<a class="glass-btn" href="https://wa.me/918000540156" target="_top" rel="noopener">WhatsApp Enquiry</a>
</div>
</div>
</main>
<script>
(()=>{const hero=document.getElementById('hero'),inner=document.getElementById('heroInner'),orb=document.getElementById('glassOrb');const fine=matchMedia('(hover:hover) and (pointer:fine)').matches,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(fine&&!reduce){let tx=0,ty=0,sx=0,sy=0;hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*10;ty=((e.clientY-r.top)/r.height-.8)*7});hero.addEventListener('pointerleave',()=>{tx=0;ty=0});function motion(){sx+=(tx-sx)*.07;sy+=(ty-sy)*.07;inner.style.transform='translate3d('+sx+'px,'+sy+'px,0)';orb.style.marginLeft=(-sx*1.4)+'px';orb.style.marginTop=(sy*1.4)+'px';requestAnimationFrame(motion)}motion()}})();
</script>

</body>
</html>
