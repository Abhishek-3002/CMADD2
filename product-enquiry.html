<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Enquiry - Choudhary Medical</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #1f2937;
}

header {
    background: #0f172a;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

.container {
    max-width: 600px;
    margin: 35px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#message {
    margin-top: 18px;
    padding: 12px;
    border-radius: 8px;
    display: none;
    text-align: center;
    font-weight: bold;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.enquiry-id {
    font-size: 20px;
    margin-top: 8px;
}
</style>
</head>

<body>

<header>
    <h1>Choudhary Medical & Drug Distributors</h1>
</header>

<div class="container">

    <div class="card">

        <h2>Product Enquiry</h2>

        <p>
            Product availability and wholesale enquiry ke liye
            neeche details submit karein.
        </p>

        <form id="enquiryForm">

            <label>Customer Name</label>
            <input
                type="text"
                id="customerName"
                placeholder="Enter your name"
                required
            >

            <label>Mobile Number</label>
            <input
                type="tel"
                id="mobile"
                placeholder="Enter mobile number"
                maxlength="10"
                required
            >

            <label>Product Name</label>
            <input
                type="text"
                id="productName"
                placeholder="Enter product name"
                required
            >

            <label>Required Quantity</label>
            <input
                type="number"
                id="quantity"
                placeholder="Enter quantity"
                min="1"
                required
            >

            <label>Additional Message</label>
            <textarea
                id="messageText"
                placeholder="Any additional requirement..."
            ></textarea>

            <button type="submit">
                Submit Enquiry
            </button>

        </form>

        <div id="message"></div>

    </div>

</div>

<script>

document.getElementById("enquiryForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const customerName =
        document.getElementById("customerName").value.trim();

    const mobile =
        document.getElementById("mobile").value.trim();

    const productName =
        document.getElementById("productName").value.trim();

    const quantity =
        document.getElementById("quantity").value;

    const messageText =
        document.getElementById("messageText").value.trim();

    const messageBox =
        document.getElementById("message");

    if (!/^[0-9]{10}$/.test(mobile)) {

        messageBox.style.display = "block";
        messageBox.className = "error";
        messageBox.textContent =
            "Please enter a valid 10-digit mobile number.";

        return;
    }

    try {

        const response = await fetch(
            "/api/enquiries",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    customerName,
                    mobile,
                    productName,
                    quantity,
                    message: messageText
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Unable to submit enquiry."
            );
        }

        messageBox.style.display = "block";
        messageBox.className = "success";

        messageBox.innerHTML = `
            Enquiry submitted successfully!
            <div class="enquiry-id">
                Enquiry ID: ${data.enquiryId}
            </div>
        `;

        document.getElementById("enquiryForm").reset();

    } catch (error) {

        messageBox.style.display = "block";
        messageBox.className = "error";
        messageBox.textContent = error.message;

    }

});

</script>

</body>
</html>
