<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Products | Choudhary Medical and Drug Distributors</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f8fb;color:#17202a}
header{background:#fff;padding:16px 6%;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px #00000012;position:sticky;top:0;z-index:10}
.logo{font-weight:800;font-size:20px;color:#123b5d} .logo span{font-size:13px;color:#16a085}
nav a{text-decoration:none;color:#222;margin-left:18px;font-weight:600}
.hero{text-align:center;padding:45px 18px 25px;background:linear-gradient(135deg,#eaf7ff,#fff)}
.hero h1{font-size:36px;color:#123b5d;margin-bottom:10px} .hero p{color:#66727d}
.search{max-width:650px;margin:24px auto 0} .search input{width:100%;padding:15px 20px;border:1px solid #d7e0e8;border-radius:30px;font-size:16px;outline:none}
.products{max-width:1250px;margin:auto;padding:25px 18px 100px;display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:20px}
.product{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 5px 18px #00000010;transition:.2s}
.product:hover{transform:translateY(-3px)}
.imgbox{height:190px;background:#f8fafc;display:flex;align-items:center;justify-content:center;padding:10px}
.imgbox img{width:100%;height:100%;object-fit:contain}
.info{padding:15px} .brand{font-size:11px;color:#16a085;font-weight:700;text-transform:uppercase}
h3{font-size:18px;color:#123b5d;margin:6px 0} .info p{font-size:12px;color:#687681;min-height:38px}
.qtyrow{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0}
.qtyrow button{width:30px;height:30px;border:0;border-radius:8px;background:#e8f1f5;font-size:20px;cursor:pointer}
.qtyrow span{font-weight:700}
.add{width:100%;padding:11px;border:0;border-radius:9px;background:#123b5d;color:#fff;font-weight:700;cursor:pointer}
.add:hover{background:#16a085}
.cart{position:fixed;right:20px;bottom:20px;background:#16a085;color:#fff;border:0;border-radius:40px;padding:15px 20px;font-weight:800;box-shadow:0 5px 20px #0003;cursor:pointer;z-index:20}
footer{background:#123b5d;color:#fff;text-align:center;padding:30px 15px}
footer p{margin-top:7px;opacity:.85}
@media(max-width:600px){nav{display:none}.hero h1{font-size:28px}.products{grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}.imgbox{height:145px}.info{padding:10px}h3{font-size:14px}.info p{font-size:10px}.add{font-size:11px}}
