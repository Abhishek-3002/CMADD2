<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Offers | CMADD Admin</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#f4f8f7;color:#183333;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto}.panel{background:#fff;padding:20px;border-radius:15px;margin:18px 0;box-shadow:0 8px 28px #1833330b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}input,textarea{width:100%;padding:11px;border:1px solid #ccd8d5;border-radius:8px;font:inherit}textarea{min-height:85px;resize:vertical}.full{grid-column:1/-1}button,.btn{border:0;border-radius:9px;padding:11px 15px;background:#116466;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#edf6f2;color:#116466}.muted{color:#617471}.message{margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.offer{border:1px solid #e0ebe7;border-radius:12px;padding:15px;background:#fbfdfc}.status{font-size:12px;border-radius:20px;background:#e5f7eb;color:#176b38;padding:5px 8px}.off{background:#ffe8e8;color:#9d2929}@media(max-width:620px){body{padding:12px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:15px}}</style></head><body><main class="wrap"><a href="admin.html" class="secondary btn">← Admin dashboard</a><h1>Festival & Business Offers</h1><p class="muted">Create offers for the public website. No wholesale price or discount percentage is published. Customers can share offers through WhatsApp.</p><section class="panel"><h2>Create an offer</h2><form id="form" class="grid"><div class="full"><label for="title">Offer / campaign title *</label><input id="title" maxlength="120" required placeholder="e.g. Diwali Medical Store Special"></div><div class="full"><label for="description">Offer details for customers *</label><textarea id="description" maxlength="1000" required placeholder="Describe the offer without public rates or discount percentage"></textarea></div><div class="full"><label for="eligible">Eligible products / categories *</label><input id="eligible" maxlength="250" required value="Selected products — ask on WhatsApp"></div><div><label for="starts">Start date *</label><input id="starts" type="date" required></div><div><label for="ends">End date *</label><input id="ends" type="date" required></div><div class="full"><button type="submit" id="submit">Create Offer</button></div></form><p id="message" class="message" aria-live="polite"></p></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Existing offers</h2><a href="offers.html" target="_blank" class="btn secondary">View public offers</a></div><div id="list" class="cards">Loading offers…</div></section></main><script>
const form=document.getElementById("form"),message=document.getElementById("message"),list=document.getElementById("list"),submit=document.getElementById("submit");function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
async function api(url,opts={}){const r=await fetch(url,{credentials:"same-origin",...opts});const d=await r.json();if(r.status===401){location.href="admin-login.html";throw new Error("Admin login required")}if(!r.ok||!d.success)throw new Error(d.message||"Request failed");return d}
async function load(){try{const d=await api("/api/admin/offers");list.innerHTML=d.offers.length?d.offers.map(o=>'<article class="offer"><span class="status '+(o.active?'':'off')+'">'+(o.active?'Active':'Inactive')+'</span><h3>'+esc(o.title)+'</h3><p>'+esc(o.description)+'</p><p><b>Eligible:</b> '+esc(o.eligible_categories)+'</p><p class="muted">'+esc(o.starts_at)+' to '+esc(o.ends_at)+'</p><p class="muted">Offer ID: '+esc(o.offer_code)+'</p><button data-id="'+Number(o.id)+'" data-active="'+(o.active?0:1)+'">'+(o.active?'Deactivate':'Activate')+'</button></article>').join(""):'<p>No offers created yet.</p>'}catch(e){list.textContent=e.message}}
form.addEventListener("submit",async e=>{e.preventDefault();submit.disabled=true;message.textContent="Saving offer…";try{const d=await api("/api/admin/offers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:form.title.value.trim(),description:form.description.value.trim(),eligibleCategories:form.eligible.value.trim(),startsAt:form.starts.value,endsAt:form.ends.value,active:true})});message.textContent=d.message+" Offer ID: "+d.offerCode;form.reset();form.eligible.value="Selected products — ask on WhatsApp";await load()}catch(err){message.textContent=err.message}finally{submit.disabled=false}});
list.addEventListener("click",async e=>{const b=e.target.closest("button[data-id]");if(!b)return;b.disabled=true;try{const d=await api("/api/admin/offers/"+b.dataset.id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({active:Number(b.dataset.active)})});message.textContent=d.message;await load()}catch(err){message.textContent=err.message;b.disabled=false}});
load();
</script></body></html>
